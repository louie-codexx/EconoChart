experiment:
  id: sft_qlora_r16_domain_v1
  hypothesis: QLoRA on language projections learns domain structure and arithmetic while fitting a 24GB RTX 4090.

seed: 20260821

model:
  name_or_path: Qwen/Qwen3-VL-4B-Instruct
  dtype: bfloat16
  min_pixels: 200704       # 256 visual tokens = 256 * 28 * 28
  max_pixels: 802816       # 1024 visual tokens; first OOM control knob
  gradient_checkpointing: true
  quantization:
    mode: 4bit
    quant_type: nf4
    compute_dtype: bfloat16
    double_quant: true

adapter:
  method: qlora
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  use_rslora: false
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  train_vision: false
  train_projector: false

data:
  train:
    - path: data/generated/econochart_v2/subsets/sft_train_9600.jsonl
      expected_rows: 9600
  eval:
    - path: data/generated/econochart_v2/subsets/val_512.jsonl
      expected_rows: 512

training:
  output_dir: outputs/sft_qlora_r16_domain_v1
  num_train_epochs: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0002
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  optim: paged_adamw_8bit
  bf16: true
  tf32: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  max_length: null
  completion_only_loss: true
  packing: false
  padding_free: false
  eval_strategy: steps
  eval_steps: 250
  save_strategy: steps
  save_steps: 250
  save_total_limit: 2
  logging_steps: 10
  logging_first_step: true
  report_to: [tensorboard]
  remove_unused_columns: false
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  skip_memory_metrics: false
  save_only_model: false
