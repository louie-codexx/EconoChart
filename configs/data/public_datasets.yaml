project:
  seed: 20260821

public:
  chartqa:
    dataset_id: HuggingFaceM4/ChartQA
    output_root: data/generated/public/chartqa
    # The default mixture uses an 8k deterministic training subset so the
    # domain data remains the majority. Test stays complete; validation rows
    # sharing an image with test are removed deterministically without refill.
    max_samples:
      train: 8000
      val: null
      test: null

  chartqapro:
    dataset_id: ahmed-masry/ChartQAPro
    output_root: data/generated/public/chartqapro
    # Test-only benchmark. It must never be added to an SFT or GRPO mixture.
    max_samples:
      test: null

  mmefinance:
    dataset_id: hithink-ai/MME-Finance
    revision: 715793a723bbd05a3b9de291f9032d1576833fbf
    output_root: data/generated/public/mmefinance
    annotation_file: MMfin.tsv
    image_archive: MMfin.zip
    expected_rows: 1171
    # English open-ended benchmark only. Evaluation-only: never train or tune on it.
