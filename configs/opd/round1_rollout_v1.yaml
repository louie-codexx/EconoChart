experiment:
  id: opd_round1_student_rollout_v1
  stage: student_on_policy_rollout
  round: 1

seed: 20260821

model:
  name_or_path: Qwen/Qwen3-VL-4B-Instruct
  adapter_path: outputs/grpo_qlora_48g_domain_v1/final_adapter
  expected_adapter_sha256: d47c083114e26000c1df5bd52676a1ca9dc2ca708a70c7944c97b3824404486b
  dtype: bfloat16
  min_pixels: 200704
