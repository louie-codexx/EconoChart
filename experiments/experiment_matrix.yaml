project: EconoChart
base_model: Qwen/Qwen3-VL-4B-Instruct
data_version: econochart-v2.0
comparison_seed: 20260821

rules:
  - Freeze the test IDs and hashes before the base run.
  - Change one primary factor per ablation.
  - Select SFT hyperparameters only on the fixed 512-row validation panel.
  - Reserve the complete 2,496-row internal test for Base and selected milestone checkpoints.
  - Never use ChartQA test or ChartQAPro for training, early stopping, or parameter selection.
  - Report internal capability slices, external benchmarks, efficiency, and qualitative failures.
  - Do not enter GRPO until the selected SFT adapter passes its evaluation gate.

experiments:
  - id: D0_sample_validation
    stage: data
    status: completed
    config: configs/data/econochart_sample.yaml
    hypothesis: The final data pipeline produces coherent, leak-free, fixed-size records and images.
    evidence: data/samples/econochart_v2/validation_report.json
    result: 8 entities, 16 charts, 64 records, zero validation issues.

  - id: D1_frozen_training_subsets
    stage: data
    status: completed
    config: configs/data/training_subsets.yaml
    evidence: experiments/results/20260822_data_subset_summary.json
    hypothesis: Entity- and chart-aware reduction preserves coverage while removing redundant questions and rollout cost.
    outputs: [sft_screen_4800, sft_train_9600, grpo_train_3600, val_512]
    result: The audited build produced 4,800/9,600/3,600/512 rows with fixed hashes, full training-entity coverage, a nested SFT screen, and zero test rows in the development panel.
    decision: Subset hashes were frozen before parameter screening and remained unchanged through formal SFT and GRPO.

  - id: B0_base_internal
    stage: baseline
    status: completed
    config: configs/eval/base_internal.yaml
    evidence: experiments/results/20260822_base_internal_summary.json
    hypothesis: The base model's errors identify the true domain and reasoning gaps before adaptation.
    primary_metrics: [overall, numeric, trend, risk, hard_overall]
    result: The audited 2,496-row internal baseline scored 0.349780 overall; numeric recall was 0.225027, risk was 0.059233, and 46.234% of outputs hit the token cap.
    decision: This frozen internal baseline is the control for formal SFT and GRPO comparisons.

  - id: B1_base_external
    stage: baseline
    status: in_progress
    config: configs/eval/base_external.yaml
    prerequisite: audited ChartQA and ChartQAPro preparation
    launched_at: 2026-08-30T10:16:07+08:00
    data_gate: passed with 2,500 fixed ChartQA test rows and 1,946 fixed evaluable ChartQAPro rows
    progress: Base evaluation was launched; no auditable model result is recorded yet.
    hypothesis: External chart benchmarks test whether internal synthetic-data gains generalize beyond EconoChart-v2.
    decision: Keep external claims closed until all Base/SFT/GRPO model evaluations and qualitative guardrails pass.

  - id: S0_sft_smoke
    stage: sft
    status: completed
    config: configs/train/sft_qlora_smoke.yaml
    evidence: experiments/results/20260822_sft_smoke_summary.json
    hypothesis: The final VLM data/model/QLoRA/collator/save-reload chain works on the target GPU.
    primary_metrics: [finite_loss, trainer_peak_allocated_delta_gib, adapter_reload]
    result: Two steps completed with finite train/eval losses; the 504-tensor language-only adapter saved and independently reloaded. Trainer peak allocated delta was 1.813 GiB above its pre-training baseline, not a whole-device peak.
    decision: The engineering gate passed; no capability claim is made from the smoke loss.

  - id: S1_qlora_r16_domain
    stage: sft
    status: completed
    config: configs/train/sft_qlora_4090.yaml
    control: B0_base_internal
    output: outputs/sft_qlora_r16_domain_v1/final_adapter
    evaluation_config: configs/eval/sft_internal.yaml
    evidence:
      training_summary: experiments/results/20260825_sft_training_summary.json
      screening_summary: experiments/results/20260825_sft_screening_summary.json
      summary: experiments/results/20260826_sft_internal_summary.json
      artifact_audit: outputs/evaluation/sft_qlora_r16_domain_v1_internal_v1_artifact_audit_v1.json
      paired_report: outputs/evaluation/base_internal_v1_to_sft_qlora_r16_domain_v1_internal_v1_paired_v1.json
    hypothesis: LLM-only QLoRA improves domain structure and verifiable reasoning on a 24GB GPU.
    data_budget: 9,600 rows x 2 epochs; all 2,400 train entities and 4,800 charts retained.
    selected_hyperparameters:
      learning_rate: 0.0002
      rank: 16
      alpha: 32
    selection_evidence: On the fixed 512-row validation panel, 2e-4 reliably beat 1e-4; at 2e-4, rank 16 beat rank 8 by 0.011745 overall with paired 95% CI [0.002010, 0.020636].
    result: Formal SFT completed on 9,600 rows for 2 epochs. The audited 2,496-row internal test scored 0.806499 overall and 0.752796 hard overall; versus Base, paired overall delta was +0.456719 with 95% CI [0.448794, 0.464756].
    pending_guardrails: [ChartQA, ChartQAPro, qualitative_failure_review]
    primary_metrics: [overall, numeric, trend, evidence, risk]
    guardrails: [ChartQA, ChartQAPro, output_length, format]

  - id: S2_rank_ablation
    stage: sft_ablation
    status: completed
    prerequisite: S3_learning_rate_ablation selects the learning rate with rank fixed at 16.
    matched_learning_rate_configs:
      5e-5:
        - configs/train/sft_qlora_r8_lr5e5_screen.yaml
        - configs/train/sft_qlora_lr5e5_ablation.yaml
      1e-4:
        - configs/train/sft_qlora_r8_ablation.yaml
        - configs/train/sft_qlora_r16_screen.yaml
      2e-4:
        - configs/train/sft_qlora_r8_lr2e4_screen.yaml
        - configs/train/sft_qlora_lr2e4_ablation.yaml
    conditional_configs: [configs/train/sft_qlora_r32_ablation.yaml]
    evidence: experiments/results/20260825_sft_screening_summary.json
    data_budget: 4,800 rows x 1 epoch; compare on the same val_512 IDs.
    single_factor: adapter rank (8/16; run 32 only if 16 is capacity-limited), alpha fixed at 2r
    result: Rank 16 selected at learning rate 2e-4; rank 32 was not triggered because hard/risk evidence did not show residual capacity limitation.
    decision: Select the smallest rank whose quality gain is supported by paired metrics.

  - id: S3_learning_rate_ablation
    stage: sft_ablation
    status: completed
    configs:
      - configs/train/sft_qlora_lr5e5_ablation.yaml
      - configs/train/sft_qlora_r16_screen.yaml
      - configs/train/sft_qlora_lr2e4_ablation.yaml
    evidence: experiments/results/20260825_sft_screening_summary.json
    data_budget: 4,800 rows x 1 epoch; compare on the same val_512 IDs.
    single_factor: learning rate (5e-5/1e-4/2e-4)
    fixed_anchor: rank 16, alpha 32
    result: Learning rate 2e-4 selected; paired validation improved overall, numeric, numeric recall, numeric precision, trend, and hard overall versus 1e-4.
    decision: Select by the fixed internal validation panel, optimization stability, and efficiency; never use external test results for selection.

  - id: S4_quantization_ablation
    stage: sft_ablation
    status: conditional
    configs:
      - configs/train/sft_qlora_r16_screen.yaml
      - configs/train/sft_lora_4090_ablation.yaml
    single_factor: 4-bit QLoRA versus BF16 LoRA
    decision: Quantify quality, memory, and throughput trade-offs.

  - id: S5_public_mix_ablation
    stage: sft_ablation
    status: code_ready
    trigger_status: passed
    trigger_evidence:
      external_conclusion: NO_EXTERNAL_GAIN
      base_to_sft_overall_exact_delta: -0.018893
      base_to_sft_chartqa_exact_delta: -0.0252
      exact_regressions_with_relaxed_regression: 212
      exact_regressions_total: 282
    configs:
      - configs/train/sft_qlora_4090.yaml
      - configs/train/sft_qlora_4090_mixed_chartqa.yaml
    control: outputs/sft_qlora_r16_domain_v1/final_adapter
    candidate_output: outputs/sft_qlora_r16_domain_chartqa_v1/final_adapter
    evaluation_configs:
      - configs/eval/sft_mixed_internal.yaml
      - configs/eval/sft_mixed_external.yaml
    readiness: Local config, portable sampling, CPU input-scope preflight, tests, and canonical evaluation identities are ready; the AutoDL inputs-only report is still required before GPU launch.
    data_budget: 9,600 domain + 3,200 fixed-seed ChartQA rows x 2 epochs
    single_factor: add a 3,200-row fixed-seed ChartQA subset to 9,600 domain rows
    compute_disclosure: Keeping domain exposures fixed increases total rows and expected optimizer steps from 1,200 to about 1,600; this 33.3% compute increase is part of the add-data intervention and a potential confound.
    registered_acceptance:
      chartqa_exact: paired 95% CI lower bound above 0 and point delta at least +0.0126 versus domain-only SFT
      internal_overall_and_numeric: each paired 95% CI lower bound at least -0.01
      chartqapro_relaxed: paired 95% CI lower bound at least -0.01
      inconclusive_policy: do not automatically add another mixture ratio or rerun GRPO
    decision: Test whether generic chart QA improves without diluting domain reasoning.

  - id: R0_grpo_4090_smoke
    stage: grpo
    status: completed
    config: configs/train/grpo_qlora_4090_smoke.yaml
    prerequisite: selected and evaluated SFT adapter
    output: outputs/smoke/grpo_qlora_4090_from_formal_sft_v1/final_adapter
    evidence: experiments/results/20260826_grpo_smoke_summary.json
    hypothesis: Qwen3-VL VLM rollouts and all offline-tested rewards are compatible on 24GB.
    primary_metrics: [finite_loss, reward_variance, adapter_updates, adapter_reload]
    result: Two optimization steps completed with finite loss; all 504 adapter tensors changed and the saved quantized adapter reloaded successfully.

  - id: R1_grpo_48g_full
    stage: grpo
    status: completed
    config: configs/train/grpo_qlora_48g.yaml
    prerequisite: R0 smoke and SFT-to-GRPO gate
    output: outputs/grpo_qlora_48g_domain_v1
    launched_at: 2026-08-26T18:31:25+08:00
    completed_at: 2026-08-27T22:35:16+08:00
    launch_environment: RTX 4090 vGPU with 47.37 GiB visible memory
    launch_gate: Preflight passed with 3,600 train rows, 512 eval rows, 4 generations, and effective batch size 4.
    recovery: Resumed from the audited checkpoint-2900 after an AutoDL billing shutdown; upgraded only the Torch runtime for the Transformers security gate and forced UTF-8 for the TRL model-card template. Training objectives and hyperparameters were unchanged.
    protocol_deviation: R1 was launched after the internal SFT and adapter gates but before the planned external and qualitative guardrails. Treat R1 as an internally audited exploratory run; no external-generalization or final-product claim is allowed until those guardrails close.
    evaluation_config: configs/eval/grpo_internal.yaml
    evidence:
      summary: experiments/results/20260828_grpo_internal_summary.json
      artifact_audit: outputs/evaluation/grpo_qlora_48g_domain_v1_internal_v1_artifact_audit_v1.json
      sft_to_grpo_paired_report: outputs/evaluation/sft_internal_v1_to_grpo_internal_v1_paired_v1.json
      base_to_grpo_paired_report: outputs/evaluation/base_internal_v1_to_grpo_internal_v1_paired_v1.json
    hypothesis: Verifiable GRPO improves numeric and trend correctness without reward hacking or external regression.
    data_budget: 3,600 prompts x 4 generations = 14,400 rollouts; every train entity appears at least once.
    result: Training reached step 3,600 and the final adapter passed static and reload audits. On the audited 2,496-row internal test, GRPO scored 0.806343 overall and 0.754140 hard overall.
    attribution: Versus SFT, paired overall delta was -0.000157 with 95% CI [-0.002294, 0.002112]; every metric was inconclusive, so R1 established neither a significant incremental gain nor a significant regression. Versus Base, overall delta was +0.456563, but this is the cumulative SFT-plus-GRPO effect and is not attributable to GRPO alone.
    decision: Do not claim an incremental GRPO capability gain; finish external and qualitative guardrails before the final conclusion.
    pending_guardrails: [ChartQA, ChartQAPro, qualitative_failure_review]
    primary_metrics: [overall, numeric, trend]
    guardrails: [format, evidence, risk, ChartQA, ChartQAPro, output_length]

  - id: R2_reward_ablation
    stage: grpo_ablation
    status: not_triggered
    variants: [all_rewards, no_format_or_length, no_numeric, no_trend]
    prerequisite: R1 provides a measurable non-zero effect
    result: R1 did not establish a measurable non-zero SFT-to-GRPO effect on the fixed internal test.
    decision: R2 was not run; do not attribute any capability change to individual reward components without the missing prerequisite effect.
