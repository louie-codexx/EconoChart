name: cpu-quality-gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU dependencies
        run: python -m pip install -e ".[data,dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Unit tests
        run: python -m pytest
      - name: Validate tracked sample
        run: econochart-validate --dataset-root data/samples/econochart_v2 --full-image-scan
